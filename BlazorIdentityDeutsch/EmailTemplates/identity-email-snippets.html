<!-- ActionBlock für Bestätigungslink, Passwort-Reset oder Änderung der E-Mail-Adresse -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="#2366a6" style="border-radius:7px;"><a href="{{ActionUrl}}" style="display:inline-block;padding:15px 25px;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;">{{ActionText}}</a></td></tr></table>
<!-- Alternativer ActionBlock für einen sechsstelligen Bestätigungscode -->
<div style="background:#eef5fc;border:1px solid #d5e5f5;border-radius:9px;padding:22px;text-align:center;"><div style="font-size:12px;letter-spacing:1px;color:#526b86;margin-bottom:12px;">DEIN BESTÄTIGUNGSCODE</div><div style="font-size:32px;letter-spacing:8px;font-weight:bold;color:#163c68;">{{Code}}</div></div>
