<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
            .img-center {
                display: flex;
                align-items: center;
                justify-content: start;
                padding-left: 10px;
                background-color: #c5d9ee;
                border: 1.25px solid darkorange;
                border-radius: 20px;
                width: 100%;
                height: 52px;
            }

                .img-center img {
                    display: block;
                    margin-right: 8px;
                    width: 42px;
                    height: 42px;
                    object-fit: contain;
                }

                .img-center span {
                    font-size: 21px;
                    font-weight: bold;
                    letter-spacing: .2px;
                }
        </style>
        <title>{{Title}}</title>
    </head>
    <body style="margin:0;padding:0;background:#f2f5f9;font-family:Arial,Helvetica,sans-serif;color:#243247;">
        <div style="display:none;font-size:1px;color:#f2f5f9;max-height:0;overflow:hidden;opacity:0;">{{Preheader}}</div>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f2f5f9;">
            <tr>
                <td align="center" style="padding:38px 16px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:600px;background:#ffffff;border:1px solid #e3e9f1;border-radius:14px;overflow:hidden;">
                        <tr>
                            <td style="background:#163c68;padding:30px 38px;color:#ffffff;">
                                <!-- Optional: SVG als externe Ressource wird nicht von allen E-Mail-Clients unterstützt. Für beste Kompatibilität PNG per CID einbetten: src="cid:company-logo". -->
                                <div class="img-center"><img src="{{LogoUrl}}" alt="Logo {{AppName}}" /><span>{{AppName}}</span></div>
                                <div style="font-size:13px;color:#c5d9ee;margin-top:6px; padding-left: 5px;">Sicherheit und Benutzerkonto</div>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding:38px 38px 20px;">
                                <div style="font-size:12px;font-weight:bold;letter-spacing:1.5px;color:#3973ad;text-transform:uppercase;">Benachrichtigung</div>
                                <h1 style="font-size:27px;line-height:1.3;margin:12px 0 24px;color:#172d46;">{{Title}}</h1>
                                <p style="font-size:16px;line-height:1.65;margin:0 0 18px;">Hallo {{UserName}},</p>
                                <p style="font-size:15px;line-height:1.8;margin:0 0 26px;color:#42536a;">{{Message}}</p>
                                <!-- Für Bestätigung/Reset: ActionBlock durch den Button unten ersetzen. Für 2FA: CodeBlock verwenden. -->
                                {{ActionBlock}}
                                <p style="font-size:13px;line-height:1.7;color:#6b7789;margin:24px 0 0;">{{SecurityNotice}}</p>
                            </td>
                        </tr>
                        <tr><td style="padding:20px 38px 30px;"><div style="height:1px;background:#e8edf4;"></div><p style="font-size:12px;line-height:1.7;color:#7a8799;margin:20px 0 0;">Diese Nachricht wurde automatisch von {{AppName}} versendet. Bitte antworte nicht auf diese E-Mail.</p><p style="font-size:12px;color:#7a8799;margin:9px 0 0;">© {{Year}} {{AppName}}</p></td></tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
